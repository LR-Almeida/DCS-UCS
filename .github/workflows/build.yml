name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Code signing (SignPath Foundation): only for release tags, and only once the repository variable
      # SIGNPATH_ORGANIZATION_ID exists (see docs/SIGNING.md). Until then releases are built unsigned.
      SIGN: ${{ startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "0.1.2-alpha" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish executables
        shell: pwsh
        run: |
          $projects = "UCS.Server", "UCS.Client", "UCS.ProfileGen"
          foreach ($p in $projects) {
            dotnet publish "src/$p/$p.csproj" -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=${{ steps.version.outputs.value }} -o publish
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force publish/Lua, publish/Server-Files | Out-Null
          Copy-Item src/Lua/UCS-Hook.lua, src/Lua/UCS-Export.lua publish/Lua/
          Copy-Item src/Lua/UCS-ServerHook.lua, Server-Files/UCS-AutoConnect.cfg publish/Server-Files/
          Copy-Item README.md, LICENSE, PRIVACY.md publish/
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem publish

      - name: Upload unsigned executables (signing)
        if: env.SIGN == 'true'
        id: unsigned-exes
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-executables
          path: |
            publish/UCS-Client.exe
            publish/UCS-Server.exe
            publish/UCS-ProfileGen.exe

      - name: Sign executables (SignPath, manual approval)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: executables
          github-artifact-id: ${{ steps.unsigned-exes.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-executables
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Use signed executables
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-executables/*.exe publish/ -Force
          Get-ChildItem publish/*.exe | ForEach-Object { "{0}: {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }

      - name: Install Inno Setup 7 (pinned + checksum)
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
          INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest $env:INNO_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/PORTABLE=1", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not found after install" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC /Q "/DAppVersion=${{ steps.version.outputs.value }}" installer/UCS-Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload unsigned installer (signing)
        if: env.SIGN == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: installer/Output/DCS-UCS-Setup-${{ steps.version.outputs.value }}.exe

      - name: Sign installer (SignPath, manual approval)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-installer
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Use signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-installer/*.exe installer/Output/ -Force
          Get-ChildItem installer/Output/*.exe | ForEach-Object { "{0}: {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).Status }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath DCS-UCS-portable-${{ steps.version.outputs.value }}.zip

      - name: SHA-256 checksums (used by the in-app updater)
        shell: pwsh
        run: |
          $files = @(Get-ChildItem installer/Output/*.exe) + @(Get-ChildItem DCS-UCS-portable-*.zip) +
                   @(Get-Item publish/UCS-Client.exe, publish/UCS-Server.exe, publish/UCS-ProfileGen.exe)
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          # LF line endings so "sha256sum -c SHA256SUMS.txt" works too
          [IO.File]::WriteAllText("$PWD/SHA256SUMS.txt", (($lines -join "`n") + "`n"), [Text.Encoding]::ASCII)
          Get-Content SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DCS-UCS-${{ steps.version.outputs.value }}
          path: |
            publish/UCS-Client.exe
            publish/UCS-Server.exe
            publish/UCS-ProfileGen.exe
            installer/Output/*.exe
            DCS-UCS-portable-*.zip
            SHA256SUMS.txt

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            publish/UCS-Client.exe
            publish/UCS-Server.exe
            publish/UCS-ProfileGen.exe
            installer/Output/*.exe
            DCS-UCS-portable-*.zip
            SHA256SUMS.txt
