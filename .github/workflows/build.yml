name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}".TrimStart('v') } else { $v = "0.1.0-alpha" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish executables
        shell: pwsh
        run: |
          $projects = "UCS.Server", "UCS.Client", "UCS.ProfileGen"
          foreach ($p in $projects) {
            dotnet publish "src/$p/$p.csproj" -c Release -r win-x64 --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:EnableCompressionInSingleFile=true -p:DebugType=none `
              -p:Version=${{ steps.version.outputs.value }} -o publish
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          New-Item -ItemType Directory -Force publish/Lua, publish/Server-Files | Out-Null
          Copy-Item src/Lua/UCS-Hook.lua, src/Lua/UCS-Export.lua publish/Lua/
          Copy-Item src/Lua/UCS-ServerHook.lua, Server-Files/UCS-AutoConnect.cfg publish/Server-Files/
          Copy-Item README.md, LICENSE publish/
          Remove-Item publish/*.pdb -ErrorAction SilentlyContinue
          Get-ChildItem publish

      - name: Install Inno Setup 7 (pinned + checksum)
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
          INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest $env:INNO_URL -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup checksum mismatch: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          Start-Process $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/PORTABLE=1", "/DIR=`"$dir`"" -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not found after install" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          & $env:ISCC /Q "/DAppVersion=${{ steps.version.outputs.value }}" installer/UCS-Installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath DCS-UCS-portable-${{ steps.version.outputs.value }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DCS-UCS-${{ steps.version.outputs.value }}
          path: |
            publish/UCS-Client.exe
            publish/UCS-Server.exe
            publish/UCS-ProfileGen.exe
            installer/Output/*.exe
            DCS-UCS-portable-*.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            publish/UCS-Client.exe
            publish/UCS-Server.exe
            publish/UCS-ProfileGen.exe
            installer/Output/*.exe
            DCS-UCS-portable-*.zip
